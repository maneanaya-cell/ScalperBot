name: Ejecutar Bot de Trading

permissions:
  contents: write

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar la versión de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias (ccxt y pandas)
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy

      - name: Ejecutar script de trading
        env:
          BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
          BINGX_SECRET_KEY: ${{ secrets.BINGX_SECRET_KEY }}
        run: python Bottrading.py

      - name: Guardar historial de operaciones en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add historial_operaciones.csv || true
          git commit -m "Auto-update historial de operaciones CSV" || true
          git push || true
